name: Publish npm packages
run-name: npm-release-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact release commit created by y pub
        required: true
        type: string
      request_id:
        description: Unique request ID created by y pub
        required: true
        type: string

permissions: {}

concurrency:
  group: ssui-npm-publish
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  HUSKY: '0'

jobs:
  build:
    if: >-
      github.repository == 'spo-fee/ssui' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/dev-atnd-6.x')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
          package-manager-cache: false
      - name: Validate release commit
        run: node scripts/release/ci.cjs check
      - name: Install fixed release tools
        run: npm install --global npm@11.16.0 yarn@1.22.22 --ignore-scripts
      - name: Restore Yarn download cache
        id: yarn-cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.temp }}/ssui-yarn-cache
          key: yarn-download-v1-${{ runner.os }}-${{ runner.arch }}-node24.18.1-yarn1.22.22-${{ github.ref_name }}-${{ hashFiles('**/.yarnrc', '**/.npmrc', 'lerna.json', 'scripts/release/ci.cjs') }}-${{ hashFiles('yarn.lock', 'packages/*/yarn.lock') }}
          restore-keys: |
            yarn-download-v1-${{ runner.os }}-${{ runner.arch }}-node24.18.1-yarn1.22.22-${{ github.ref_name }}-${{ hashFiles('**/.yarnrc', '**/.npmrc', 'lerna.json', 'scripts/release/ci.cjs') }}-
      - name: Report Yarn download cache
        run: |
          if [ "$CACHE_HIT" = 'true' ]; then
            echo 'Yarn 下载缓存：精确命中；仍执行冻结安装。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Yarn 下载缓存：未精确命中；可能复用同环境旧下载文件，缺失依赖正常下载。具体恢复结果见缓存步骤日志。' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CACHE_HIT: ${{ steps.yarn-cache.outputs.cache-hit }}
      - name: Install frozen dependencies and link packages
        run: node scripts/release/ci.cjs install
        env:
          YARN_CACHE_FOLDER: ${{ runner.temp }}/ssui-yarn-cache
      - name: Check release scripts
        run: yarn test:release
      - name: Build packages
        run: yarn build
      - name: Test packages
        run: yarn test --ci --runInBand
      - name: Pack release artifacts
        run: node scripts/release/ci.cjs pack
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/npm-release
      - name: Save immutable release artifacts
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
          package-manager-cache: false
      - name: Install fixed npm CLI
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Download original build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
      - name: Verify publisher and publish remaining packages
        run: node scripts/release/ci.cjs publish
        env:
          NPM_PUBLISHERS: ${{ vars.NPM_PUBLISHERS }}
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/npm-release
